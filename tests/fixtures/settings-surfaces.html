<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sanitized ChatGPT settings surfaces</title>
  <style>
    :root { font-family: system-ui, sans-serif; --bg-primary: #212121; --bg-elevated-primary: #303030; --bg-tertiary: #454545; --text-primary: #f5f5f5; --interactive-bg-discovery-soft-default: rgba(146, 79, 247, .15); --interactive-label-discovery-soft-default: rgb(184, 151, 244); }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: #171717; color: var(--text-primary); }
    button, select { font: inherit; }
    button { color: inherit; cursor: pointer; }
    .fixture-controls { margin-bottom: 16px; }
    [role="dialog"] { max-width: 800px; margin: auto; border-radius: 24px; overflow: hidden; border: 1px solid #454545; background: var(--bg-primary); }
    .settings-navigation { display: flex; padding: 16px; gap: 8px; }
    [role="tab"] { padding: 8px 16px; border: 0; border-radius: 8px; background: transparent; }
    [role="tab"][data-state="active"] { background: #383838; }
    .settings-panel { padding: 0 24px 24px; }
    .sticky { position: sticky; top: 0; padding: 20px 0; }
    h2, h3, p { margin: 0 0 12px; }
    h2 { font-size: 20px; }
    h3 { font-size: 16px; }
    .bg-token-bg-primary { background: var(--bg-primary); }
    .bg-token-bg-elevated-primary { background: var(--bg-elevated-primary); }
    .bg-token-bg-tertiary { background: var(--bg-tertiary); }
    .bg-token-text-primary { background: var(--text-primary); }
    .rounded-xl { border-radius: 12px; }
    .rounded-full { border-radius: 999px; }
    .rounded-sm { border-radius: 4px; }
    .usage-card { padding: 20px; margin-bottom: 16px; }
    .relative { position: relative; }
    .absolute { position: absolute; }
    .inset-0 { inset: 0; }
    .h-full { height: 100%; }
    .h-1 { height: 4px; }
    .w-full { width: 100%; }
    .usage-meter { margin: 16px 0; }
    .interactive-button { padding: 0; border: 0; background: transparent; color: #aaa; }
    .underline { text-decoration-line: underline; }
    .decoration-dotted { text-decoration-style: dotted; }
    .underline-offset-2 { text-underline-offset: 2px; }
    .btn { padding: 8px 14px; border: 1px solid #5d5d5d; }
    .btn-secondary { background: #383838; }
    .plugin-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 0; }
    .plugin-row button { padding: 8px; border: 0; background: transparent; }
    .bg-token-interactive-bg-discovery-soft-default { background: var(--interactive-bg-discovery-soft-default); }
    .text-token-interactive-label-discovery-soft-default { color: var(--interactive-label-discovery-soft-default); }
  </style>
  <script src="../../shared/themes.js"></script>
  <script>
    const fixtureMessageListeners = [];
    globalThis.chrome = {
      runtime: { onMessage: { addListener(listener) { fixtureMessageListeners.push(listener); } } },
      storage: { sync: { get(_keys, callback) { callback({}); } }, onChanged: { addListener() {} } }
    };
  </script>
</head>
<body>
  <div class="fixture-controls"><label for="theme-select">Theme</label> <select id="theme-select"></select></div>
  <!-- Native role, state, paint and control classes captured from Usage and Plugins settings. -->
  <section role="dialog" aria-label="Settings">
    <div class="settings-navigation" role="tablist">
      <button role="tab" data-state="active" aria-selected="true" aria-controls="settings-Usage" id="usage-tab">Usage</button>
      <button role="tab" data-state="inactive" aria-selected="false" aria-controls="settings-Plugins" id="plugins-tab">Plugins</button>
    </div>
    <div role="tabpanel" data-state="active" class="settings-panel bg-token-bg-primary" id="settings-Usage">
      <header class="sticky bg-token-bg-primary" id="usage-header"><h2>Usage</h2></header>
      <div class="usage-card bg-token-bg-elevated-primary rounded-xl" id="usage-card">
        <h3>Weekly usage</h3>
        <div role="tabpanel" data-state="active" id="usage-detail-panel">
          <p>29% used</p>
          <div class="usage-meter relative h-1 w-full" id="usage-meter">
            <div class="absolute inset-0 rounded-full bg-token-bg-tertiary" id="usage-track"></div>
            <div class="absolute h-full rounded-full bg-token-text-primary" style="width: 29%" id="usage-fill"></div>
          </div>
          <button class="interactive-button interactive-label-secondary interactive-outline-secondary rounded-sm underline decoration-dotted underline-offset-2" id="usage-countdown">Resets in 4 days</button>
        </div>
      </div>
      <h3>Credits <span class="bg-token-interactive-bg-discovery-soft-default text-token-interactive-label-discovery-soft-default rounded-sm" id="credits-badge">New</span></h3>
      <button class="btn btn-secondary btn-small rounded-full" id="usage-action">Manage credits</button>
    </div>
    <div role="tabpanel" data-state="active" class="settings-panel bg-token-bg-primary" id="settings-Plugins">
      <header class="sticky bg-token-bg-primary" id="plugins-header"><h2>Plugins</h2></header>
      <div class="plugin-row"><span>Example plugin</span><button id="plugin-action">Manage</button></div>
    </div>
  </section>
  <script src="../../content/content.js"></script>
  <script>
    const themeSelect = document.getElementById('theme-select');
    for (const theme of GPTskinsThemes.themes) themeSelect.add(new Option(theme.name, theme.id));
    themeSelect.value = 'default';
    themeSelect.addEventListener('change', () => {
      for (const listener of fixtureMessageListeners) listener({ type: 'GPTSKINS_APPLY_THEME', themeId: themeSelect.value }, {}, () => {});
    });
  </script>
</body>
</html>
